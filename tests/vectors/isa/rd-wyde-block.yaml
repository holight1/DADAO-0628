# RD wyde immediate and block copy test vectors

# ─── Wyde immediate (rwii) ───────────────────────────────────────────────────

- mnemonic: orw
  format: rwii
  class: semantic
  encoding:
    word: "0x14040005"
  input_state:
    rd:
      rd1: "0xFFFFFFFFFFFFFFFF"
  expected_state:
    rd:
      rd1: "0xFFFFFFFFFFFFFFFF"
  expected_fault: null
  status: active
  wiki_cite: "spec.md §3.13"
  notes: "orw rd1,w0,5; OR 5 into LSW (already FF → FF)"

- mnemonic: setzw
  format: rwii
  class: semantic
  encoding:
    word: "0x16040005"
  input_state:
    rd:
      rd1: "0xDEADBEEFCAFEBABE"
  expected_state:
    rd:
      rd1: "0x0000000000000005"
  expected_fault: null
  status: active
  wiki_cite: "spec.md §3.13"
  notes: "setzw rd1,w0,5; zero all wydes then set w0=5 → 0x0000000000000005"

- mnemonic: setow
  format: rwii
  class: semantic
  encoding:
    word: "0x17050000"
  input_state:
    rd:
      rd1: "0x0000000000000000"
  expected_state:
    rd:
      rd1: "0xFFFFFFFF0000FFFF"
  expected_fault: null
  status: active
  wiki_cite: "spec.md §3.13"
  notes: "setow rd1,w1,0; all wydes=0xFFFF then w1=0 → 0xFFFFFFFF0000FFFF"

- mnemonic: andnw
  format: rwii
  class: semantic
  encoding:
    word: "0x1504000F"
  input_state:
    rd:
      rd1: "0xFFFFFFFFFFFFFFFF"
  expected_state:
    rd:
      rd1: "0xFFFFFFFFFFFFFFF0"
  expected_fault: null
  status: active
  wiki_cite: "spec.md §3.13"
  notes: "andnw rd1,w0,15; clear low 4 bits of LSW; 0xFF→0xF0"

# ─── RB wyde immediate ────────────────────────────────────────────────────────

- mnemonic: setzw
  format: rwii
  op: 0x4E
  class: semantic
  encoding:
    word: "0x4E050000"
  input_state:
    rb:
      rb1: "0xDEADBEEFCAFEBABE"
  expected_state:
    rb:
      rb1: "0x0000000000000000"
  expected_fault: null
  status: active
  wiki_cite: "spec.md §4.6"
  notes: "setzw rb1,w1,0; zeros all wydes then sets w1=0 → rb1=0x0"

- mnemonic: orw
  format: rwii
  op: 0x4C
  class: semantic
  encoding:
    word: "0x4C040005"
  input_state:
    rb:
      rb1: "0x0000000000000000"
  expected_state:
    rb:
      rb1: "0x0000000000000005"
  expected_fault: null
  status: active
  wiki_cite: "spec.md §4.6"
  notes: "orw rb1,w0,5; OR 5 into RB LSW"

# ─── Block copy (orri) ────────────────────────────────────────────────────────

- mnemonic: rd2rd
  format: orri
  class: semantic
  encoding:
    word: "0x10A0A042"
  input_state:
    rd:
      rd1: "0x1111111111111111"
      rd2: "0x2222222222222222"
      rd10: "0x0000000000000000"
      rd11: "0x0000000000000000"
  expected_state:
    rd:
      rd10: "0x1111111111111111"
      rd11: "0x2222222222222222"
  expected_fault: null
  status: active
  wiki_cite: "spec.md §3.14"
  notes: "rd2rd rd10,rd1,2; copy rd1..rd2 to rd10..rd11"

- mnemonic: rd2rb
  format: orri
  class: semantic
  encoding:
    word: "0x10A4A042"
  input_state:
    rd:
      rd1: "0xAAAAAAAAAAAAAAAA"
      rd2: "0xBBBBBBBBBBBBBBBB"
    rb:
      rb10: "0x0000000000000000"
      rb11: "0x0000000000000000"
  expected_state:
    rb:
      rb10: "0xAAAAAAAAAAAAAAAA"
      rb11: "0xBBBBBBBBBBBBBBBB"
  expected_fault: null
  status: active
  wiki_cite: "spec.md §4.7"
  notes: "rd2rb rb10,rd1,2; copies rd1,rd2 to rb10,rb11 (64-bit stored)"

- mnemonic: rb2rd
  format: orri
  class: semantic
  encoding:
    word: "0x10A8A042"
  input_state:
    rb:
      rb1: "0x3333333333333333"
      rb2: "0x4444444444444444"
    rd:
      rd10: "0x0000000000000000"
      rd11: "0x0000000000000000"
  expected_state:
    rd:
      rd10: "0x0000333333333333"
      rd11: "0x0000444444444444"
  expected_fault: null
  status: active
  wiki_cite: "spec.md §4.7"
  notes: "rb2rd rd10,rb1,2; copies rb1,rb2 to rd10,rd11 (48-bit RB zero-extends to 64-bit RD)"

- mnemonic: rb2rb
  format: orri
  class: semantic
  encoding:
    word: "0x10ACA042"
  input_state:
    rb:
      rb1: "0x5555555555555555"
      rb2: "0x6666666666666666"
      rb10: "0x0000000000000000"
      rb11: "0x0000000000000000"
  expected_state:
    rb:
      rb10: "0x0000555555555555"
      rb11: "0x0000666666666666"
  expected_fault: null
  status: active
  wiki_cite: "spec.md §4.7"
  notes: "rb2rb rb10,rb1,2; copies rb1,rb2 to rb10,rb11 (48-bit truncated from setup)"

- mnemonic: rd2rd
  format: orri
  class: legality
  encoding:
    word: "0x10A00000"
  input_state:
    rd:
      rd0: "0x0000000000000000"
  expected_state: null
  expected_fault: ILLI
  status: active
  wiki_cite: "spec.md §2.6"
  notes: "rd2rd rd0,rd0,0; rdhb=rd0 + immu6=0 → ILLI"

