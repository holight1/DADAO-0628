# Control flow test vectors
# Source: contracts/isa/spec.md §5

# TDD DESIGN NOTE（DL-029a — implemented）:
# 分支语义测试使用 "branch-over-poison" pattern：
#   [setup]
#   [branch cond, +1]   ← 若 taken，跳过 poison
#   [unimp]             ← poison: 若 NOT taken 则 ILLI
#   [emit_exit(0)]      ← taken 路径：正常退出
# build_test_binary.py 的 build_branch_test_binary() 实现此 layout。
# 测试向量字段使用 branch_behavior: taken/not_taken 标记。

