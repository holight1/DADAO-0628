  input_state:
    rd:
      rd1: "0xFFFFFFFFFFFFFF00"
  expected_state:
    rd:
      rd3: "0x0FFFFFFFFFFFFFF0"
  expected_fault: null
  status: active
  wiki_cite: "spec.md §3.11"
  notes: "shru rd3,rd1,4; logical right shift"

- mnemonic: exts
  format: orri
  class: semantic
  encoding:
    word: "0x10703078"
  input_state:
    rd:
      rd1: "0x0000000000000080"
  expected_state:
    rd:
      rd3: "0xFFFFFFFFFFFFFF80"
  expected_fault: null
  status: active
  wiki_cite: "spec.md §3.11"
  notes: "exts rd3,rd1,56; sign-extend byte 0x80 → 0xFFFF...FF80"

- mnemonic: extz
  format: orri
