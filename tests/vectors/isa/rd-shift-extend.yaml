# RD shift/extend test vectors

- mnemonic: shlu
  format: orri
  class: semantic
  encoding:
    word: "0x10643044"
  input_state:
    rd:
      rd1: "0x00000000000000FF"
  expected_state:
    rd:
      rd3: "0x0000000000000FF0"
  expected_fault: null
  status: active
  wiki_cite: "spec.md §3.11"
  notes: "shlu rd3,rd1,4; 0xFF << 4 = 0xFF0"

- mnemonic: shrs
  format: orri
  class: semantic
  encoding:
    word: "0x10683044"
  input_state:
    rd:
      rd1: "0xFFFFFFFFFFFFFF00"
  expected_state:
    rd:
      rd3: "0xFFFFFFFFFFFFF0F0"
  expected_fault: null
  status: active
  wiki_cite: "spec.md §3.11"
  notes: "shrs rd3,rd1,4; arithmetic right shift of negative value"

- mnemonic: shru
  format: orri
