  notes: "extz rd3,rd1,56; zero-extend byte 0xFF"

- mnemonic: shlu
  format: orrr
  class: semantic
  encoding:
    word: "0x10443042"
  input_state:
    rd:
      rd1: "0x0000000000000001"
      rd2: "0x0000000000000004"
  expected_state:
    rd:
      rd3: "0x0000000000000010"
  expected_fault: null
  status: active
  wiki_cite: "spec.md §3.11"
  notes: "shlu rd3,rd1,rd2; 1 << rd2[5:0]=4 → 0x10"

