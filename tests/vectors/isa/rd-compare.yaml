# RD compare test vectors

- mnemonic: cmps
  format: rrii
  class: semantic
  encoding:
    word: "0x12282F85"
  input_state:
    rd:
      rd2: "0x0000000000000005"
      rd10: "0x0000000000000000"
  expected_state:
    rd:
      rd10: "0x0000000000000001"
  expected_fault: null
  status: active
  wiki_cite: "spec.md §3.8"
  notes: "cmps rd10,rd2,-2043; 5 > -2043 → rd10 = 1"

