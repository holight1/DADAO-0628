# RD load/store test vectors

- mnemonic: ldbs
  format: rrii
  class: semantic
  encoding:
    word: "0x30042008"
  input_state:
    rb:
      rb2: "0x0000000000100000"
      rb0: "0x0000000000100000"
    memory:
      - address: "0x0000000000100008"
        value: "0x80"
        width: 1
  expected_state:
    rd:
      rd1: "0xFFFFFFFFFFFFFF80"
  expected_fault: null
  status: active
  wiki_cite: "spec.md §3.1"
  notes: "ldbs rd1,rb2,+8; load byte 0x80 → sign-ext to 0xFFFF...FF80"

