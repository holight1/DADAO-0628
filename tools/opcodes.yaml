# DADAO SimRISC M1 opcode table — machine-readable encoding inventory
# Source: contracts/isa/spec.md Appendix A (Wiki commit 13a414d)
#
# Each record:
#   mnemonic: string
#   format:   string (iiii/oiii/orii/orri/orrr/rrrr/rrri/rrii/riii/rwii)
#   op:       hex byte [31:24]
#   ha:       hex nybble [23:18] or null
#   mask:     fixed-bit mask
#   value:    fixed-bit value
#   fields:   list of operand fields
#   legality: list of static constraint strings
#   wiki_cite: string

