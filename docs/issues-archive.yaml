  # 正走到指令选择/调度阶段，本类别触发对象从 3 个暴涨到 **15 个**（新增
  # 12 个，全部是浮点相关：`complex/__cexpf.c`、`math/atanf.c`、
  # `math/fdimf.c`、`math/log2f.c`、`math/logf.c`、`math/sincosf.c`、
  # `math/sincos.c`、`math/sinf.c`、`math/sin.c`、`math/tanf.c`、
  # `math/tan.c`、**`stdio/vfprintf.c`**——即 ML-020a 的直接目标文件）。
  #
  # **根因定位（ML-020a 首次给出，非猜测）**：最小 2 行复现（无 musl 依赖）：
  # `double cmp(double a,double b){ return (a>=b)+(a==0); }`
  # 用 `clang --target=dadao -O1`（-O0 不复现，-O1/-O2/-O3 都复现）编译，
  # 100% 复现同一断言。gdb 定位到 `ScheduleDAGSDNodes.cpp:372`
  # （`BuildSchedUnits` "scan up to find glued preds" 循环）：某个
  # `CopyFromReg`（读回 libcall 返回值 `$rd31`）节点的 Glue 操作数指向了
  # 一个只有 1 个结果值的 `ADDI_RRII`（materialize-constant）节点的 ResNo=1
  # ——即"同一基本块出现 2 个独立的 CALL"时，产出的 glue 链拓扑不满足
  # SelectionDAG "每个节点至多一个 glue 输入/输出、glue 链必须是单一线性
  # 链"的不变量。三次独立触发路径（DL-063c 间接调用单个 call / ML-010a
  # 直接调用两个 call / ML-020a libcall 合成两个 call）曾被怀疑指向同一个
  # 更底层缺陷。
  #
  # **ML-021a 真根因（与 ML-020a 猜测的方向不同）**：不是"CALL_IIII 手工
  # getMachineNode vs Pat<>"（这个方向此前已被独立试过、同样撞同一断言，
  # 见 `DADAOInstrInfo.td` CALL_PSEUDO_INDIRECT 注释），而是
  # `DADAOISelDAGToDAG.cpp::Select()` 对 `ISD::CALLSEQ_START`/`CALLSEQ_END`
  # 的手写特判：`ReplaceUses(SDValue(Node,0), Node->getOperand(0));
  # CurDAG->RemoveDeadNode(Node);` 只重定向了 ResNo=0（chain），从未处理
  # `callseq_end` 的 ResNo=1（glue）结果——一旦同一基本块出现第二个独立
  # 调用序列，前一个 callseq_end 被删除后其 glue 结果的悬空引用会与新分配
  # 节点的内存产生错误关联，被调度器 BuildSchedUnits 的"已插入"检测到。
  # 用 `llc -debug-only=isel` 转储证实：修复前 "Selected selection DAG" 里
  # 同一 `CALL_IIII` 节点被打印两次（图结构损坏），且另一个 CopyFromReg 的
  # glue 操作数显示为 `<<Deleted Node!>>`。修复方案：仿照 RISC-V
  # `ADJCALLSTACKDOWN`/`ADJCALLSTACKUP` 的标准做法，把 callseq_start/end
  # 转成 tablegen `Pat<>` 选择（`DADAOInstrInfo.td` 新增两个 `DADAOPseudo`
  # + 目标专属 `callseq_start`/`callseq_end` SDNode 重声明），并在
  # `DADAOInstrInfo.cpp` 的 `DADAOGenInstrInfo` 构造里把 CFSetup/CFDestroy
  # 从误传的字面量 `0` 改成真实的
  # `DADAO::ADJCALLSTACKDOWN`/`DADAO::ADJCALLSTACKUP`。**订正**（subagent
  # review 发现）：`0` 实际是生成枚举里的 `PHI`（target-independent 伪指
  # 令，`Target.td:1200`）而非 HALT_RIII——此前完成区/commit message 误记
  # 为"碰巧等于 HALT_RIII 的 opcode"。这不影响修复本身的正确性：
  # `PHIElimination` 在 PEI 之前已把所有 PHI 节点消除，所以无论 opcode 0
  # 对应哪条真实指令，"PEI 从未真正识别出任何 call-frame 伪指令"这个结论
  # 依然成立，只是原因是"函数体里此时已不存在 opcode 0 的 MI"而非"opcode 0
  # 恰好被其它指令占用"。
  #
  # 验证：全量 lit E2E 61/61（新增 direct_call_multicall_block.test 覆盖
  # 非浮点场景）、差分 AGREE(4-way)=200/DIVERGE=0、`vfprintf.o` 用真实
  # musl 构建标志编译通过、干净 fresh 全量 musl 重建后本类别（连同
  # musl-backend-assert-node-already-inserted、
  # musl-backend-assert-asmprinter-unmapself）触发对象清零；musl 总失败
  # 对象数从 ~180 降到 10（剩余 10 个分属两个既有不相关问题——
  # musl-backend-assert-unanalyzable-fallthrough /
  # -instrinfo-unreachable——及一个新发现的独立缺口
  # musl-backend-dynamic-stackalloc-unimplemented）。

