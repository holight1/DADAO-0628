- id: varargs-pointer-args-lost-rb-bank-save-area
  title: "变参函数的指针型可变实参在 RB bank ABI 下被 LLVM 的 va_start 保存区机制完全丢失（保存区只 spill RD bank rd16..rd31，从不捕获 RB bank 的可变指针实参）——DL-069a RB bank 修复暴露的既有 varargs 缺口（Varargs 条目）的具体实例，非新回归"
  status: closed
  scope: [CodeGen, ABI, libc]
  blocks: null
  resolved_by: "DL-072a (LLVM 3aa546d1d0cd, patch 0050, 2026-07-23)"
  # ML-013a（2026-07-18）：修复 pico_stubs.s 后 malloc_hello.test 用重新
  # 编译（DL-069a 后的 clang + 同步重建的 picolibc libc.a）的产物仍然
  # 运行错误——`printf("%s %s\n", p, q)` 输出 "OK2 OK"（两个字符串顺序
  # 互换，而非崩溃/乱码），反汇编三层调用链定位根因：
  #
  # 1. 调用点（main.o）：`printf(fmt, p, q)` 里 fmt/p/q 全是指针，按
  #    DL-069a 正确实现的固定参数+可变参数（M1 范围内 CCIfPtr 对可变实
  #    参同样生效）RB bank 独立计数规则，编译器把三者依次放进
  #    rb16(fmt)/rb17(p)/rb18(q)——这一步完全正确，符合 contracts/abi/
  #    spec.md §2.1。
  # 2. 被调用点（picolibc `printf`，变参函数序言）：函数序言无条件把
  #    rd16..rd31（RD bank）全部 spill 到栈上的"varargs 保存区"，然后
  #    把 `ap`(va_list) 设为该保存区起始地址；这是 LowerFormalArguments
  #    对 IsVarArg 函数的既有实现（DL-069a 未改动这部分，完成区已如实
  #    报告"varargs 保存区仍 RD-only 既有缺口"）——但保存区只覆盖 RD
  #    bank，从未覆盖 RB bank 的 rb17/rb18，所以 p/q 的真实值从未被
  #    保存区捕获。`ap` 起始位置对应的是 rd16 的保存槽位，而不是任何
  #    与 p/q 相关的内容。
  # 3. `vfprintf` 通过 `va_arg(ap, char*)` 依次从该保存区读值——读到的
  #    是 rd16/rd17 在进入 `printf` 时刚好残留的值（本例中恰好是
  #    main() 更早前 malloc 调用留下的、看起来合理但实际无关的堆指针），
  #    不是真正的 p/q，产生了"看似合理但错误"的输出（两个可打印字符
  #    串被换位），而不是崩溃或明显乱码——这也是本条目比通用 "Varargs"
  #    条目更值得单独记录的原因：故障模式具有迷惑性，不会被"程序崩溃
  #    了"这类粗粒度信号捕获，只能通过反汇编逐层核对调用点/序言/
  #    va_arg 三处的寄存器 bank 分配才能定位。
  #
  # 在 DL-069a 之前，所有指针（含可变实参）统一走 RD bank，"保存区只
  # 覆盖 RD bank"这条既有限制不构成问题（可变指针实参本来就落在保存区
  # 里）；contracts/abi/spec.md 本身明确将 varargs 排除出 M1 范围（第7-8
  # 行"M1 BasicCodeGen scope: non-variadic functions..."+ Varargs 表格行
  # "Excluded from M1"），所以这不是 DL-069a 或 ML-013a 引入的回归，而是
  # 一直存在、一直被排除在规范范围外的能力，只是恰好在此之前"错得刚好一
  # 致"从未被观察到。
  #
  # 处置（ML-013a）：不修复 LLVM（超出 ML-013a 授权范围，硬约束禁止
  # 改动 LLVM；且真正的修复需要变参保存区机制同时感知 RD/RB 两个 bank，
  # 工作量与风险都对应一个独立任务，不应该在 ML-013a 里顺手做）。改为
  # 让 tests/lit/E2E/Inputs/malloc_hello.c 改用 `fputs`（固定 2 参数、
  # 非变参、两个参数都是指针，完全落在 DL-069a 正确修复的固定参数 RB
  # bank 约定内）替换 `printf("%s %s\n", p, q)`——测试标题承诺验证的是
  # malloc/free 正确性，不是变参 ABI，这样改动后测试仍然真实验证
  # malloc/free（未绕过/未伪造），只是不再意外依赖一个规范本来就声明
  # 排除在外的能力。双后端验证：QEMU/gem5 均输出真实 "OK OK2"。
  #
  # 建议：如果/当项目决定把 varargs 纳入范围（Varargs 条目当前
  # blocks: null，尚无阻断的里程碑），修复应该同时处理：(a) IsVarArg
  # 函数序言的保存区同时 spill RD 与 RB 两个 bank 各自的寄存器列表；
  # (b) `va_list`/`va_arg` 的实现（picolibc 侧，freestanding、非
  # glibc-style）需要知道如何在两个独立保存区之间按 C 源码里参数的原始
  # 类型顺序交替读取——这是比 (a) 更难的部分，因为 va_arg 在调用点已经
  # 丢失了"这是第几个参数/它在源码里是什么类型"这类信息，只能按 C 标准
  # 的隐式类型提升规则由调用者/被调用者一致地约定连续读取顺序。
  #
  # 排期决策（2026-07-18，架构师/用户讨论）：不在 ML-014a 里插队修（绕开
  # 方案已够用），但也不无限期拖到"gcc-c-torture 扫描撞上了再说"——那样
  # 会把"torture 用例本身失败"和"我们自己的 varargs bug"混在一起，排查
  # 成本高得多。**排期为：ML-014a 收尾后、正式开始大规模
  # gcc-c-torture/llvm-test-suite 扫描或 kernel K1 任务之前**，插入一个
  # 专门任务修复（见 `docs/adr/0012-test-tiering-strategy.md` D5 第4条、
  # `contracts/abi/spec.md §6`/`docs/open-spec-issues.md` 已同步记录）。
  # **修复方向的新洞察**：上面 (b) 提到的"两个独立保存区之间交替读取"
  # 难题，其实 `contracts/abi/spec.md §2.3`（固定参数栈溢出场景）已经
  # 解决过同一类问题——"两个 bank 共享一个溢出区，按全局声明顺序排列，
  # 不分 bank"，这条规则在 DL-069a ground-truth 复核时已用专项探针验证
  # 成立（16个int+16个pointer+溢出int/pointer/int 各一个，溢出区偏移
  # 严格按声明顺序 0/8/16 排列）。变参保存区大概率应该照搬同一个思路
  # （一块按声明顺序交替排列的统一保存区，而不是"RD 保存区+RB 保存区"
  # 两块分开），这样被调用方就不需要凭空"猜"下一个变参在哪个 bank——
  # 顺序信息已经隐含在保存区的物理布局里，和 §2.3 的解法完全对应。

  #
  # ML-025a（2026-07-23，独立确认新实例，非新回归）：本任务补齐了 musl
  # vfscanf.o 链接期缺失的 6 个 f32/除法 softfloat 符号后（见
  # `musl-vfscanf-missing-single-precision-and-divide-softfloat-symbols`
  # 归档条目），`scanf("%d", &x)` 首次真正编译+链接成功（0 个未定义符
  # 号），但双后端运行时崩溃：QEMU/gem5 均在 `SIM_END`/进程退出码
  # `129`（`0x81` MALIGN）终止。用 `sscanf("42", "%d", &x)`（纯计算，
  # 排除一切 I/O/SYS_read 因素）复现同一崩溃；用
  # `sscanf("hello", "hello")`（zero 个输出型指针可变实参，
  # 无 `%` 转换符）作负对照，干净通过（`exit=42`），证明 vfscanf/
  # intscan 解析机制本身在此目标上是健全的——崩溃 100% 由 `&x` 这个
  # **输出型指针可变实参**触发，与本任务新增的 6 个 softfloat 符号的
  # 算术正确性无关（后者已经过 210 万次 host fuzz 零失败 + 反汇编
  # 全文核查零自递归独立验证，见 ML-025a 完成区）。`scanf` 的语义决定
  # 了它的转换说明符**总是**需要至少一个输出型指针可变实参（这是
  # `scanf` 存在的意义），所以本条目对**任意** `scanf`/`vscanf`
  # 转换调用都是无法绕过的阻断，不是"换个格式说明符就能避开"的情形
  # （不同于 ML-022a 的 printf 测试能靠只用 `%d`/`%u` 避开——printf 的
  # `%d` 按值传递 `int`，不涉及指针可变实参，但 scanf 没有这种"按值"
  # 形式）。ML-025a 因此把 `tests/lit/E2E/musl_scanf_int.test` 的验收
  # 范围收窄为"链接成功 + 一个不使用 scanf/仅验证新增 SYS_read 基础设施
  # 的 stdin 读取双后端测试"（`musl_stdin_getchar.test`），未按原计划
  # 交付"scanf 双后端 PASS + FileCheck 断言解析结果"——那一项在这条
  # varargs 缺陷修复前不可能真正做到，详见 ML-025a 完成区。
  #
  # DL-072a（2026-07-23）按 wiki §可变参数将实现改为 caller 在调用点
  # 按原始参数顺序填充统一 8-byte-slot 保存区，命名参数也双写；删除
  # callee RD-only spill，并由 va_start 直接定位 incoming-SP 上的保存区。
  # Clang DADAO ABI 同步固定 va_arg 为每次 +8，大端窄整数从 slot+4 读取。
  # 独立真实验收：混合 RD/RB、fixed/unnamed overflow、printf("%s %s")、
  # scanf("%d",&x) 均在 QEMU/gem5 通过；scanf 原 XFAIL 已删除。
