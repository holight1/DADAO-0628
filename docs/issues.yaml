# ── Found by wiki 升级审计 (WU-001a, ADR-0013 首次执行) ────────────────────────

- id: gem5-se-heap-not-covered-by-elf-segment
  title: "dadao.ld 的 __heap_start/__heap_end 无输出 section/无 PHDR 覆盖，gem5 SE 按 PT_LOAD memsz 建页表故堆访问缺页；QEMU 走裸 flat binary 不受影响"
  status: closed
  scope: [gem5, picolibc, linker-script]
  blocks: []
  resolved_by: DG-007b（dadao.ld 加 `.heap (NOLOAD)` 输出 section 落进 `:data` PHDR，__heap_start/__heap_end 符号名不变；重链 malloc_hello 后第二个 PT_LOAD memsz=0x7df8000 覆盖 0x80008000..0x87e00000；gem5 SE 上原故障地址 0x80009000 不再缺页，程序推进到 tick=3222000（原 187000）执行完 malloc/memset/strcmp 逻辑，撞上独立的 codegen-indirect-call-rb0-misuse；E2E 29/29、四方 AGREE 200/DIVERGE=0 不回归）
  # DG-007a 根因（subagent，architect 复核）：malloc_hello.elf 在 gem5 SE 下
  # 于 tick=187000 崩溃 `Page table fault @ 0x80009000`——gdb 确认故障 PC 在
  # picolibc malloc 内部（_set_size，首次 malloc(32) 的 bookkeeping），故障
  # 地址 0x80009000 = roundUp(.bss 结束地址 0x80008045, 4096)，正是"最后一个
  # 被映射页之后一字节"。根因：dadao.ld 的 `__heap_start = .; __heap_end =
  # 0x87E00000;` 是裸 location-counter 符号，未落进任何 PHDRS 分配的输出
  # section，第二个 PT_LOAD 段（:data）的 memsz 止于 .bss，不覆盖堆区。
  # picolibc libos/fallback/sbrk.c 的 __fallback_sbrk 纯指针递增
  # (__heap_start..__heap_end)，不经过任何 syscall，全靠链接脚本保证内存
  # 真实存在。QEMU 端用 `llvm-objcopy -O binary` 产出的裸 flat binary
  # 而非 ELF（`-kernel %t.bin`），QEMU 不解析 PT_LOAD/memsz，是一整块
  # 已映射 DRAM 窗口，故不受影响——gem5 SE 按 ELF 段严格建页表是正确行为，
  # 有缺陷的是 dadao.ld 本身。修复方向：给堆区加一个 SHT_NOBITS 的 `.heap`
  # 输出 section 落进 `:data` PHDR（或单独第三个 PT_LOAD），扩大 memsz 覆盖
  # 堆区（NOBITS 不占文件字节，QEMU 侧 flat binary 零开销）。

- id: codegen-indirect-call-rb0-misuse
  title: "CALL_PSEUDO_INDIRECT 的 expandPostRAPseudo 用 rb0 作 call 的 base，但 rb0 语义=PC+4（非零）——绝对地址间接调用被算成 PC+4+绝对地址；QEMU 因已知 QEMU-rb0-not-maintained 缺陷（rb0 恒读 0）而巧合跑对"
  status: closed
  scope: [CodeGen, gem5]
  blocks: []
  resolved_by: DL-066a（DADAOInstrInfo.cpp expandPostRAPseudo 的 CALL_PSEUDO_INDIRECT 改用 rd2rb 桥把绝对地址物化进固定 scratch rb5（reserved/unallocated/无 ABI 角色，别于 rb3/rb4=gp/tp），再 `CALL_RRII rb5, RD0, 0`（base=绝对地址，offset=rd0=0）；反汇编确认新指令序列 `rd2rb rb5, rdX, 1` + `call rb5, rd0, 0` 不再用 rb0；独立最小探针 tests/lit/E2E/indirect_call.test（无 malloc/heap 的函数指针互调）新增并双后端 exit=42 通过——修复前用同一探针在 gem5 上 ground-truth 复现崩溃 `Page table fault @ 0x100000054`，PC=0x80000048/PC+4=0x8000004c/&add2=0x80000008，0x8000004c+0x80000008=0x100000054 精确对应根因公式；QEMU 侧不受影响（QEMU-rb0-not-maintained 仍 open，之前的巧合抵消对本探针同样成立）。E2E 29/30（新增 indirect_call.test 后计数；1 个既有失败 syscall_hello.test 为无关环境问题，与本改动无关，fix 前后均失败一致复现）、四方差分 AGREE(3-way)=200/DIVERGE=0/Sail AGREE(4-way)=200 不回归。**picolibc-goal1/2-dual-backend 仍未完全解锁**：printf_hello.test/malloc_hello.test 链接的 `.work/picolibc/build-dadao/libc.a` 是用修复前的旧编译器预建的，my_putc 间接调用点（vfprintf 内部 `f->put()`）已固化进旧目标码，需要重建 libc.a 才能让这两个既有 E2E 用例真正吃到本次修复；见新 issue `picolibc-libc-rebuild-blocked`。
  # DG-007b（2026-07-14）：确认 malloc_hello 也踩这个 bug，不止 printf_hello——
  # malloc_hello.c 调用 printf，经 stdout_min.c 的 FDEV_SETUP_STREAM 走同一
  # my_putc 函数指针间接调用点。heap 缺页问题（见
  # gem5-se-heap-not-covered-by-elf-segment，已 resolved）修复后，
  # malloc_check.elf 在 gem5 SE 上推进到 tick=3222000（原 heap 缺页在
  # tick=187000）执行完 malloc/memset/strcmp，随后在同一条 `call rb0, rd31, 0`
  # 指令（PC=0x80002464）撞上本 issue：故障地址 0x100002554 =
  # (PC+4=0x80002468) + (&my_putc=0x800000ec)，与 printf_hello 根因一致。
  # DG-007a 根因（subagent，architect 复核）：printf_hello.elf 在 gem5 SE
  # 下于 tick=120000 崩溃 `Page table fault @ 0x100000464`（与
  # gem5-se-heap-not-covered-by-elf-segment 是两个不同故障地址/不同根因，
  # 此前 ML-003m 误判两者"同一崩溃"，已更正）。gdb 确认故障 PC 在
  # stdout_min.c 的 my_putc 间接调用点，目标寄存器（rd31）持有真实绝对地址
  # 0x800000ec（&my_putc）。DADAOInstrInfo.cpp:175-176
  # `CALL_PSEUDO_INDIRECT` 展开为 `CALL_RRII RB0, <target reg>, 0`——按 spec
  # §5.4 + gem5 decoder.cc §1.3 通用语义，rbha=rb0 恒表示"base=PC+4"（不是
  # "无 base/base=0"），故实际目标 = PC+4 + 绝对地址，垃圾值。QEMU 端"能
  # 跑"是因为已知 open issue `QEMU-rb0-not-maintained`（QEMU 从不维护
  # env->rb[0]=PC+4，恒读 0）让这个误用巧合抵消——同一"两个缺陷互相掩盖"
  # 模式（另见 ML-003m 的 sbrk/gem5 brk_base 一节）。gem5 正确维护 rb0=PC+4
  # 故按 spec 语义暴露了这个真实 miscompilation。此 bug 影响任何走
  # CALL_PSEUDO_INDIRECT 的间接调用（不限 picolibc），当前只是恰好被
  # QEMU-rb0-not-maintained 掩盖，QEMU-rb0-not-maintained 一旦修复此 bug
  # 会在 QEMU 上同时暴露。修复方向：不用 rb0 做 base，改用 rd2rb 桥
  # （已有的跨 bank copy 机制，DL-051a）把目标地址物化进一个 scratch RB
  # 寄存器，再 `CALL_RRII <scratch_rb>, RD0, 0`（base=绝对地址，offset=0）。

