- id: blockcopy-rb-source-64bit-fidelity-backend-divergence
  title: "QEMU 与 gem5 对 RB-bank block-copy 指令（rd2rb/rb2rb 写 → rb2rd/rb2rb 读）在源寄存器高 16 位非零时是否保真存在真实分歧，且分歧依赖\"写入该寄存器所用的指令类别\"而非仅寄存器内容——现有逐指令语义向量（per-instruction state injection）测不出这种序列相关性"
  status: open
  scope: [QEMU, gem5, ISA]
  blocks: null
  resolved_by: null
  # ML-011a（2026-07-17）为 __get_tp/__set_thread_area 写判别性探针
  # （tests/lit/E2E/tp_probe.test）时，最初用刻意构造的、高 16 位非零的
  # 64-bit 测试值（如 0xCAFEBABE12345678）过 rb2rb 写入 rb4 再用 rb2rd
  # 读回，QEMU 与 gem5 结果不一致（QEMU exit=42 通过；gem5 exit=1，
  # 读回值高 16 位被清零）。逐层排查（4 个独立最小探针 + 直接 od -tx1 观
  # 察原始字节，绕开分支比较逻辑本身可能出错的风险）后发现：
  #
  #   写入机制 = rd2rb（RD→RB，"Reg copy → RB" 类）
  #     + 读出机制 = sto（RB reg 整体 store 到内存）+ ldo 读回：
  #     QEMU=完整 64 位、gem5=完整 64 位（一致，均不截断）
  #   写入机制 = rd2rb + 读出机制 = rb2rd：
  #     QEMU=完整 64 位；gem5=截断为 48 位（**分歧**，
  #     gem5 侧根因见 components/gem5/patches/0007-dadao-controlflow-ras.patch
  #     的 BlockCopyInst::execute()：`if (srcRb) v &= MASK48;`——按该 patch
  #     注释，这是刻意实现的"RB source 读回 48 位"语义，依据的是
  #     tests/vectors/isa/rd-wyde-block.yaml 里 rb2rd/rb2rb 向量
  #     "48-bit RB zero-extends"的记法，但这与 contracts/isa/spec.md §4.7
  #     正文"rd2rb/rb2rb/rb2rd all transfer full 64 bits"直接冲突——
  #     **规范正文 vs 现有独立向量本身就不一致**，这条本身也需要架构师/
  #     ISA 决策澄清，不是 gem5 单方面的孤立 bug)
  #   写入机制 = setzw-rb/orw-rb（Wyde immediate RB 类）
  #     + 读出机制 = rb2rd：
  #     QEMU=截断为 48 位、gem5=截断为 48 位（一致，均截断——与
  #     rd-wyde-block.yaml 向量记法相符）
  #   写入机制 = setzw-rb/orw-rb + 读出机制 = sto（bypass rb2rd）：
  #     QEMU=截断为 48 位；gem5=完整 64 位（**分歧，方向与上面那条相反**）
  #
  #   即：同一个寄存器、同一份"最终应该是什么值"，QEMU 和 gem5 的截断行为
  #   会依"写入该寄存器所用的指令类别"而变，且两个后端在不同的写入/读出
  #   组合上互相反着分歧——这明显是两个后端各自内部实现的不一致（很可能
  #   是把"是否截断"这类应该只取决于读指令本身的元数据，误关联到了写指令
  #   的历史/来源），而不是单纯某一方"实现了 spec、另一方没实现"。
  #
  #   对 ML-011a 本身：真实 musl TP/指针用途永远落在 48 位地址空间内（
  #   contracts/isa/spec.md §1.3 "Effective address width is 48 bits"），
  #   高 16 位天然恒为 0，因此上述截断/不截断分歧对真实指针值不可观测——
  #   已验证：用 48-bit-clean 测试值（0x0000BABE12345678 /
  #   0x0000112233445566）跑与 __set_thread_area/__get_tp 完全相同的指令
  #   序列（rd2rb 建值 → rb2rb 写 rb4 → rb2rd 读回），QEMU 与 gem5 结果
  #   字节级一致，tp_probe.test 用这两个安全值双后端通过。
  #
  #   本条不阻塞 ML-011a 交付，但现有 tests/vectors/isa/*.yaml 的逐指令
  #   状态注入式向量测不出这种"依赖写入历史的读取行为"（向量直接注入
  #   寄存器初值，不经过真实指令序列执行），建议架构师评估是否需要专门
  #   的序列级（非单指令）差分回归覆盖这一类 RB-bank 读写组合，并先澄清
  #   contracts/isa/spec.md §4.7 正文与 tests/vectors/isa/rd-wyde-block.yaml
  #   两个 rb2rd/rb2rb 向量之间"是否 48-bit 截断"的规范/向量不一致。

- id: dadao-pcrel-reloc-no-farsym-fallback
  title: "为\"取弱未定义外部符号地址\"生成的窄距 PC-relative 重定位没有宽距/绝对值兜底；当该符号按弱符号惯例落到地址 0、而代码装载在 0x80000000 附近时，链接器报重定位越界"
  status: open
  scope: [CodeGen, Linker]
  blocks: null
  resolved_by: null
  # ML-012a（2026-07-17）：musl 通用 `src/env/__init_tls.c` 的
  # `static_init_tls()` 有一行 `base = (size_t)_DYNAMIC - phdr->p_vaddr;`
  # ——`_DYNAMIC`（`extern weak hidden const size_t _DYNAMIC[]`）只在动态
  # 链接/PIE 可执行文件里由链接器提供 `.dynamic` 段；在纯静态、非 PIE 的
  # 链接（DADAO/musl 当前和可预见未来的唯一形态，ADR-0014 D5：无动态链
  # 接器）里，这个弱符号按约定解析为地址 0。取一个解析为地址 0 的符号地
  # 址、而代码装载在 `0x80000000`（ADR-0004 BINARY_BASE）附近，需要约
  # `-0x80000000`（~-2GiB）的位移——`ld.lld` 直接报错：
  #
  #     ld.lld: error: ...(__init_tls.o):(function static_init_tls: ...):
  #     relocation Unknown (4) out of range: -524289 is not in
  #     [-131072, 131071]; references '_DYNAMIC'
  #
  # 即 DADAO 后端为"取一个外部/弱符号地址"这类模式生成的重定位固定是窄距
  # （±131072 量级，远小于 contracts/isa/spec.md §4.8 `rela` 本身文档化
  # 的 ±512MB 单指令量级，说明实际触发的是配对里另一半更窄的重定位），
  # 且没有为"符号实际很远"这种情况提供更宽范围/绝对寻址的兜底路径——这是
  # 一个真实的后端代码生成缺口，未修复 LLVM/lld。
  #
  # ML-012a 未修改 LLVM/lld——这一行在当前静态单线程配置下本来就是运行时
  # 死代码（本任务的 `arch/dadao/crt_arch.h` 故意不提供 AT_PHDR/AT_PHNUM，
  # 见该文件头注释，`aux[AT_PHNUM]==0` 使这整个 for 循环体在运行时从不执
  # 行；DADAO 目前也没有任何动态链接器/PIE 产物，`phdr->p_type ==
  # PT_DYNAMIC` 这半个条件本身也从不为真）——新增 arch 覆盖文件
  # `src/env/dadao/__init_tls.c`，只删除这一行的函数体（保留 `if` 判断本
  # 身，只是内容清空，便于对照上游），其余与上游逐字节相同，见文件头注释
  # 完整说明。
  #
  # 建议架构师后续评估：DADAO 未来若要支持动态链接/PIE，这个覆盖文件必须
  # 删除并配合后端修复（宽距/绝对寻址取外部符号地址的能力）一起解决，
  # 现在这个 override 只是"当前阶段安全、需要在有动态链接需求时重新审视"
  # 的临时措施，不是长久方案。

