- id: musl-inline-asm-empty-clobber-reg-alloc
  title: "含 `asm volatile(\"\" ::: \"memory\")` 之类的纯 clobber（无输入/输出操作数）内联汇编在 DADAO 后端触发寄存器分配失败（couldn't allocate reg for constraint 'r'）"
  status: open
