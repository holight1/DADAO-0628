- id: musl-inline-asm-empty-clobber-reg-alloc
  title: "含 `asm volatile(\"\" ::: \"memory\")` 之类的纯 clobber（无输入/输出操作数）内联汇编在 DADAO 后端触发寄存器分配失败（couldn't allocate reg for constraint 'r'）"
  status: open
  scope: [CodeGen]
  blocks: null
  resolved_by: null
  # ML-009a/ML-010a（2026-07-17）编译 musl 全树时发现，两个独立触发点：
  # `src/string/explicit_bzero.c`（ML-009a 先发现）、
  # `src/env/__libc_start_main.c`（ML-010a 因 atomic_arch.h 补齐后才编译到
  # 这一步，新曝光）。两处都是 musl 自带的"空 asm 内存屏障"惯用法（无真实
  # 输入/输出寄存器约束，只有 clobber list），在其它成熟 target 上是无操作
  # 编译期屏障，DADAO 后端的寄存器分配器却在没有真实操作数需要分配的情况
  # 下报"couldn't allocate reg for constraint 'r'"——提示内联汇编操作数处理
  # 路径本身有缺口，非 musl 代码问题。未修复，未根因定位。
  #
  # ML-012a（2026-07-17）：`src/env/__libc_start_main.c` 这一触发点已在
  # musl 侧绕开（未修复 LLVM）——新增 arch 覆盖文件
  # `src/env/dadao/__libc_start_main.c`，把原本的 `__asm__ ( "" :
  # "+r"(stage2) : : "memory" )` 屏障替换成等价的
  # `lsm2_fn * volatile stage2 = ...;`（C 标准保证的 volatile 语义屏障，
  # 不经过任何内联汇编操作数分配路径，完全绕开这个缺口而非碰运气绕过）。
  # 该文件仅此一行与上游不同，见文件头注释。`src/string/explicit_bzero.c`
  # 这一触发点**仍未处理**（本任务未涉及该文件，不在 musl 首个 E2E 里程
  # 碑的必需符号集里），issue 状态维持 open。

