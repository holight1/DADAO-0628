- id: dadao-hfa-argument-not-implemented
  title: "HFA (homogeneous floating-point aggregate) argument passing is not implemented -- DADAOABIInfo::classifyArgumentType falls back to the pre-ML-031a indirect (byval) DefaultABIInfo behavior, unchanged, because the DADAO LLVM backend has no RF register class / floating-point CodeGen support at all"
  status: open
  scope: [abi, codegen, floating-point]
  blocks: "full DADAO-21 ABI §聚合类型参数 HFA conformance (RF bank passing)"
  resolved_by: null
  # ML-031a (aggregate struct ABI parameter passing) implemented HPA (RB
  # bank)/RD-split/indirect/sret in full per wiki, but explicitly excluded
  # HFA per its硬约束 -- DADAO has never registered f32/f64 as a legal type
  # with an associated register class (ML-020a/ML-025a already noted this
  # for scalar floats; ML-031a confirms the same gap blocks aggregate HFA).
  # DADAOABIInfo::classifyArgumentType (clang/lib/CodeGen/Targets/DADAO.cpp)
  # detects a genuine HFA (all leaves are the same type: all float or all
  # double, <= 4 fields) via the
  # same flatten() helper used for HPA, emits a compiler warning identifying
  # the type, and returns getNaturalAlignIndirect(Ty, AS) (ByVal=true) --
  # bit-for-bit the same classification EVERY aggregate got before ML-031a,
  # so no new runtime risk is introduced for this subset. Empirically, this
  # fallback happens to produce a correct result for gcc-c-torture's
  # 920625-1.c (a `struct { double x, y; }` passed as a vararg to a
  # long-lived global-array source) purely because the DADAO backend has no
  # byval-specific CC lowering code at all, so the "byval" pointer Clang
  # emits degenerates into passing the caller's own live address straight
  # through -- this is NOT a real, spec-conformant HFA implementation and
  # must not be read as "HFA basically works"; a NAMED (non-vararg) HFA
  # argument, or a vararg one sourced from a short-lived local instead of a
  # stable global, would not have this accidental safety net. Implementing
  # real conformant HFA support requires adding an RF register class and
  # associated CodeGen infrastructure first -- an independent, comparably
  # sized project, not a follow-on to ML-031a.
  # Also see docs/wiki-questions.md #6 (RD-split block ordering) and #7
  # (aggregate vararg-slot justification direction) for two related ABI
  # wording ambiguities ML-031a resolved with a documented choice rather
  # than blocking on.

- id: dadao-complex-vararg-padded-struct-field-corruption
  title: "_Complex int field inside a struct passed as a vararg reads back corrupted (imaginary part) when the struct has non-natural trailing padding (e.g. from a zero-size `__attribute__((aligned))` member pushing total size past the natural size) -- gcc-c-torture pr38151.c"
  status: open
  scope: [codegen, complex-numbers, varargs]
  blocks: null
  resolved_by: null
  # Found during ML-031a's gcc-c-torture re-sweep (code-agent/tasks/
  # ML-031a-aggregate-struct-abi-parameter-passing.md 完成区). pr38151.c
  # passes `struct S2848 { unsigned int a;
  # _Complex int b; struct {} __attribute__((aligned)) c; }` (16 bytes,
  # sizeof/alignof both 16 due to the empty aligned member) as a vararg;
  # `arg.a` and `__real__ arg.b` read back correctly but `__imag__ arg.b`
  # (struct offset 8-11, the start of the second 8-byte save-area slot)
  # does not match the caller's value, so the torture file's internal
  # check calls abort() (exit 127, gcc-c-torture's own failure signal).
  # Architect ground-truth isolation (four minimal probes, freestanding,
  # both QEMU and gem5 not required since QEMU alone reproduces/clears it):
  #   1. Same struct passed as a NAMED (non-vararg) argument: PASSES.
  #   2. Same 16-byte layout via vararg but with the _Complex field
  #      replaced by an equivalent plain `struct { int re, im; }`: PASSES.
  #   3. A smaller (12-byte, no trailing padding) struct with a real
  #      _Complex int field, via vararg: PASSES.
  #   4. The exact S2848 layout (_Complex + trailing padding) via vararg:
  #      FAILS (imaginary part only).
  # This isolates the bug to the specific combination of (a) the vararg
  # aggregate memcpy-reconstruction path (`arg = __builtin_va_arg(ap,
  # struct S2848)`) and (b) Clang's `_Complex` real/imaginary-component
  # lvalue access applied to that reconstructed temporary when the
  # underlying type has non-multiple-of-natural-size trailing padding --
  # not the ML-031a aggregate-ABI byte-block classification/transport
  # itself (probes 1-3 all exercise ML-031a's new RD-split/vararg-slot code
  # paths correctly). Confirmed pre-existing: pr38151.c was already in the
  # FAIL_RUN/abort_127 bucket in ML-026a's original sweep (docs/reviews/
  # ML-026a-gcc-c-torture-sweep-2026-07-24.md, listed among the 9
  # "尚未深挖" files) -- ML-031a did not introduce this, only diagnosed it;
  # not fixed as part of ML-031a (orthogonal to aggregate parameter ABI).

- id: gem5-differential-harness-stale-blanket-skip-rasuf
  title: "run_gem5_test.py's blanket jump/call/ret+expected_fault SKIP rule (tests/scripts/run_gem5_test.py:104-106) predates ML-015c's vector reclassification and now structurally skips 2 real RASUF vectors gem5 already implements correctly, inflating gem5-SKIP from 0 to 2 in tools/run_differential.py"
  status: open
  scope: [gem5, ISA, testing]
  blocks: null
  resolved_by: null
  # Found 2026-07-22 during an architect ground-truth spot-check of
  # tools/run_differential.py after a ~60-task run by an independently
  # operating agent ("codex", 2026-07-18~21) working on the musl
  # malloc+printf E2E milestone (ML-014a) touched an unrelated vector file.
  # Confirmed via IN-004a's independent audit (docs/reviews/
  # codex-run-integrity-audit-2026-07-21.md §2):
  #
  # - This session's stable baseline throughout was
  #   `AGREE(3-way)=200 DIVERGE=0 HARNESS=6` (interp/QEMU/gem5) with
  #   `AGREE(4-way)=200` (Sail). It is now
  #   `AGREE(3-way)=200 gem5-SKIP=2 HARNESS=0` (total coverage 202, not 200).
  # - Root cause traced to commit `b5b8c57` (task ML-015c, "align control
  #   flow vectors with spec"): a legitimate, twice-independently-reviewed
  #   correction to `tests/vectors/isa/control-flow.yaml` that moved 4
  #   jump/call/ret encoding-only records from `active` to `deferred`
  #   (correctly no longer counted anywhere) and reclassified 2 `ret`
  #   (cold-RegRAS) records' `expected_fault` from `ILLI` to `RASUF`
  #   (matching `contracts/isa/spec.md §5.6`) while keeping them `active`.
  # - `tests/scripts/run_gem5_test.py:104-106` has a blanket rule dating
  #   from the DG-004d era: any vector with
  #   `mnemonic in (jump, call, ret) and expected_fault is not None` is
  #   unconditionally SKIPped for gem5, because at the time all 6 such
  #   vectors really were harness artifacts (a trampoline-halt producing a
  #   spurious ILLI, not a real single-instruction fault) that gem5's G1
  #   single-instruction model could not reproduce. ML-015c's 2 reclassified
  #   RASUF vectors are now *real*, reproducible gem5 semantics -- gem5
  #   already implements RASUF correctly (see the closed
  #   `rasof-rasuf-exit-code-unpinned` entry in `docs/issues-archive.yaml`,
  #   DL-057b: "architect independently reran: QEMU+gem5 each RASUF=133/
  #   RASOF=132") -- but the blanket rule was never updated after ML-015c
  #   landed, so these 2 vectors keep getting structurally SKIPped instead
  #   of actually exercised.
  # - This is NOT a real gem5 semantic regression -- it's a differential
  #   harness adapter that fell one step behind a vector correction it
  #   didn't need to react to at the time it was written. No task or
  #   review file between ML-015c and this entry ever re-ran
  #   `tools/run_differential.py` to notice the `gem5-SKIP` count change
  #   (`grep -rl "run_differential" code-agent/tasks/ML-01[5-7]*.md
  #   docs/reviews/ML-01[5-7]*.md` is empty), so the current
  #   `AGREE=200/gem5-SKIP=2/HARNESS=0` composition is now the correct,
  #   accepted baseline going forward (not a regression to chase back to
  #   `HARNESS=6`), but the harness rule itself should be narrowed so gem5
  #   actually exercises the 2 RASUF vectors instead of skipping them.
  #
  # Fix direction: narrow the blanket-skip predicate in
  # `run_gem5_test.py:104-106` to only match the vectors that are still
  # genuinely harness-artifact encoding-only cases (or invert the check to
  # key off `status == 'deferred'` the same way `run_differential.py`
  # itself already does, rather than re-deriving mnemonic/fault-based
  # heuristics that can drift out of sync with the vector file again).

