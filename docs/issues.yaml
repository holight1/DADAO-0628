- id: codegen-tailcall-lowercall-assert
  title: "DADAO LowerCall 从未实现 tail-call opt-out，-O1+ 对 return foo(...) 形态尝试 sibling-call 下降，撞 LowerCall emitted a return value for a tail call 断言"
  status: open
  scope: [CodeGen]
  blocks: [llvm-test-suite-t3-above-o0]
  resolved_by: null
  # DL-065a 验证阶段发现（2026-07-14，subagent）：修完 call 隐式寄存器范围
  # 溢出后，对全部 963 个 picolibc .c 文件做 -O1 扫描，仍有 113 个文件在
  # 一个不同、独立的断言上崩溃：LowerCall emitted a return value for a
  # tail call!——DADAO 的 LowerCall 从未加 isEligibleForTailCallOptimization
  # 之类的覆写去关闭尾调用优化，故 -O1+ 遇到 `return foo(...);` 形态的
  # 代码会尝试 sibling-call 下降并崩溃。与 DL-065a 的隐式寄存器问题是两个
  # 独立缺口，未修复（本任务范围之外）。是 llvm-test-suite（ADR-0012 T3）
  # 在高于 -O0 跑起来前的另一个必修项，与 dadao-oz-undef-physreg 一起构成
  # -O1+ 支持的两大缺口。
  #
  # ML-012a（2026-07-17）：musl 自己的 crt/crt1.c（_start_c 尾部调用
  # __libc_start_main）和 src/env/__libc_start_main.c（stage2(...) 尾部
  # 调用）在 config.mak 默认 -O2 下都直接命中这个断言，阻塞了 musl 首个
  # 真实链接 E2E 里程碑。**未修复 LLVM**——在 `arch/dadao/arch.mak`
  # （musl 侧、component-lock 允许的 arch 集成文件）里加
  # `CFLAGS_AUTO += -fno-optimize-sibling-calls`，全树生效，验证直接从
  # 崩溃变为编译干净（-O2 不变，只是不再尝试 sibling-call 下降）。这是一
  # 个安全、可移植、只关闭优化的标准编译器开关，不改变任何程序语义，
  # 不是修复 LowerCall 本身。副作用（有益）：同一批全树 `make -k` 扫描
  # 显示这个断言此前命中的全部约 229 个 musl 文件在加此开关后全部消失
  # （ML-012a 完整失败分类：229→0），是这个开关对整个 issue 的一次大规
  # 模、非侵入性缓解，但 `codegen-tailcall-lowercall-assert` 本身（LLVM
  # 从未实现 tail-call opt-out）仍未修复、仍是 open——任何不走 musl
  # arch.mak（例如 llvm-test-suite 的独立 -O1+ 编译路径）的构建仍会命中。

- id: codegen-global-byte-mask-load-wrong-endian-offset
  title: "-O0：对全局/静态 int 做窄化位运算（如 `x & 0xFF`）时，narrow-load combine 选取的字节偏移按小端假设（offset+0），但 DADAO 是大端——取到最高字节而非最低字节，值整体错误"
  status: closed
  scope: [CodeGen]
  blocks: [llvm-test-suite-loop-call-accumulator]
  resolved_by: DL-068b
  # ML-004a（llvm-test-suite SingleSource 布线，2026-07-15）先发现症状：5/8
  # 挑选的纯计算测试（crc8.le/crc16.be/popcount-clz-ctz/divrem loop/divtest）
  # 在 QEMU 上把「callee 写全局累加器 + 调用点对该全局做 `& 0xFF` 再
  # return」这一模式全部得到 0；subagent 二分排除若干"调用相关"假设后
  # 判断触发条件是"return 表达式对刚被调用写过的全局做位运算"。
  #
  # 架构师复核（ground-truth）：**与函数调用完全无关**，是更通用的大端
  # narrow-load 偏移错误。零调用最小复现：
  # ```c
  # static int acc = 5;
  # int main(void) { return acc & 0xFF; }   // host=5  dadao=0  FAIL（无任何 call）
  # ```
  # 反汇编（`--triple=dadao`）：
  # ```
  # rela rb8, 0        ; rb8 = page(acc)
  # addi rb8, rb8, 0   ; rb8 += offset(acc)
  # ldbu rd31, rb8, 0  ; 从 rb8+0 读 1 字节 unsigned
  # ```
  # `ldbu ...,0` 从地址偏移 **0** 读单字节——对 DADAO 的大端 4 字节 int
  # （`5` 存为 `00 00 00 05`），偏移 0 是最高字节（=0x00），真正的低字节
  # （0x05）在偏移 **3**。这是标准 `ReduceLoadWidth`/narrow-load DAG combine
  # 把 `(load i32) & 0xFF` 优化成"直接读最低有效字节"时选错了字节偏移
  # （按小端惯例默认取 offset+0，未按大端目标调整为 offset+(width-1)）——
  # 与 DL-067b 修的 BR_CC 大端 narrow-load bug 是**同一大类"大端 narrow-load
  # 处理缺陷"的另一个独立触发点**（那次是分支条件、这次是直接返回值），
  # 但触发的具体 combine/代码路径待确认是否相同。
  #
  # 阻塞：ML-004a 里 crc8_le/crc16_be/popcount/divrem_loop/divtest 五个改写
  # 自 llvm-test-suite 的测试无法端到端跑通（已跳过，未提交为 lit fixture，
  # 避免把已知 bug 的错误值固化为"预期"）。下一步：专门任务定位具体是
  # 哪个 DAG combine 产出了这个 narrow byte load，比照 DL-067b 的排查方法
  # （`-debug-only=dagcombine` 逐步追踪），确认 DADAO target 的
  # `isBigEndian()`/相关 hook 在这条 combine 路径上是否被正确查询。
  #
  # DL-068b（2026-07-16，subagent + 架构师复核，patch 0035）：**根因更正**
  # ——不是 DAG combine 的问题。`-debug-only=dagcombine` + `-stop-after=
  # finalize-isel` MIR 双重验证：narrow-load combine 和 DADAO 的
  # `isBigEndian()` 查询都是**对的**，正确生成 `@acc + 3`（4 字节大端 int
  # 的低字节偏移），并且这个 +3 一路正确携带到 RELA_RIII/ADDI_RBRRII 的
  # MachineOperand（MIR 里能看到 `@acc + 3`）。真正丢失点在
  # `DADAOAsmPrinter::lowerToMCInst` 的 `MO_GlobalAddress` 分支——只用
  # `MO.getGlobal()` 建 `MCSymbolRefExpr`，完全没读 `MO.getOffset()`，把
  # +3 静默丢成 0，导致 `rela`/`addi` 重定位 addend 恒为 0。修复：offset
  # 非零时用 `MCBinaryExpr::createAdd` 把 offset 加进符号表达式。验证：
  # 最小复现 exit=5（QEMU/gem5 一致）；补充判别性探针（`& 0xFFFF`、高位非零
  # 值、栈变量、`short` 窄化）全部双后端正确；`align_strfn.test`
  # （DL-067b 回归）不受影响；全 E2E 33/34（同一已知 syscall_hello.test
  # 失败）、差分 AGREE(3-way)=200/DIVERGE=0、Sail AGREE(4-way)=200，零回归。
  # 重跑 ML-004a 跳过的 5 个用例：**divrem_loop 现在端到端跑通**（QEMU=
  # gem5=期望值，此前受本 bug 阻塞）；其余 4 个（crc8_le/crc16_be/
  # popcount-clz-ctz/divtest）仍不过，但故障形态已变化——3 个稳定触发
  # MALIGN（exit 0x81，QEMU/gem5 一致）、1 个（divtest）产出双后端一致但
  # 数值错误的结果，均与本 bug 无关，是独立的、尚未定位的 CodeGen 缺口
  # （未展开排查，超出本任务范围，未新开 issue——留给后续任务视需要立项）。
  #
  # ML-004b（2026-07-16，subagent）：排查了上面留下的 4 个用例，**全部 4 个
  # 收敛到同一个根因**，已拆分为新 issue
  # `codegen-call-clobbers-gprb-not-declared`（见下）。

- id: codegen-call-clobbers-gprb-not-declared
  title: "CALL 指令（CALL_IIII 直接调用 / CALL_PSEUDO_INDIRECT 间接调用，寄存器分配阶段实际能看到的两条）只声明 `Defs = [RD31]`，LowerCall 从未附加 RegMask 操作数——寄存器分配器不知道 GPRB（地址寄存器）bank 除 rb0-7（Reserved）外全部是 caller-saved，导致跨调用存活的 GPRB 地址值被静默覆盖"
  status: closed
  scope: [CodeGen]
  blocks: [llvm-test-suite-call-in-loop-address-survival]
  resolved_by: ML-004c
  # ML-004b（2026-07-16，subagent）排查 DL-068b 遗留的 4 个 llvm-test-suite
  # 失败用例（crc8.le/crc16.be/popcount-clz-ctz/divtest）。逐个重新在当前
  # 工具链上跑（发现 ML-004a/DL-068b 的 gem5 侧此前用了错误的封装方式
  # ——用 %gen_min_elf 包一个 objcopy 出的扁平 .bin，会丢失真实 ELF 的
  # .bss/.data 程序头，本应像 clang_hello.test/indirect_call.test 那样直接
  # 对 %clang+%ld.lld 产出的 %t.elf 跑 %gem5 %gem5_se；用正确方式重跑后，
  # divrem_loop 双后端一致=217，crc8.le/crc16.be/popcount-clz-ctz 三个仍
  # MALIGN(129)，divtest 仍双后端一致但数值错误，与 DL-068b 记录的分类相符）。
  #
  # **根因（架构师级 ground-truth，用 gem5 `--debug-flags=Exec` 精确定位
  # 到故障 PC + 反汇编数据流分析）**：三个 MALIGN 用例的故障指令都紧跟在
  # 一次函数调用返回之后，且访问的地址来自调用前就计算好、本应继续存活
  # 的一个 GPRB（rb8/rb9/rb10 等，spec §1.3 地址寄存器 bank）临时寄存器
  # ——但该寄存器的值在被调用函数内部被挪作他用后，从未在返回后重新计算
  # 或从溢出槽重新加载，调用点直接复用了这个已经变成别的地址的陈旧值。
  #
  # 用两个独立、干净的最小复现锁定同一机制：
  # ```c
  # // rbreuse.c：一次调用前后各有一个 GPRB 地址值，返回后复用错的那个
  # static unsigned garr[4]={10,20,30,40}, scratch_slot;
  # static unsigned touch(unsigned x){return x+1;}
  # int main(void){
  #   unsigned acc=5; acc=acc*3;
  #   unsigned v=garr[1];           // 第二个 GPRB 地址值（数组元素）
  #   unsigned r=touch(v);          // 调用
  #   scratch_slot=acc+r;           // 用第一个 GPRB 地址值（&scratch_slot）
  #   return scratch_slot;          // host=36  QEMU=21(错)  gem5=134(SIGABRT)
  # }
  # // snapshot_bug2.c：更小的复现，一次调用前后
  # int accG;
  # void bump(void){accG=accG+1;}
  # int main(void){
  #   bump();
  #   int snap=accG;                // 期望：snap 定格为 1
  #   bump();                       // 第二次调用——不该改 snap
  #   return snap & 0xFF;           // host=1  QEMU=2  gem5=2（读到了 accG 的实时值）
  # }
  # ```
  # `snapshot_bug2.c` 反汇编证实：`bump()` 的第二次调用内部把 rb8 挪去指向
  # `&accG`；main 在调用前把 `snap` 的溢出槽地址（`rb1+12`）也放在 rb8 里，
  # 调用后从未重新计算，直接 `rb2rd rd16, rb8, 1`/`orr rd16,rd16,3`/
  # `rd2rb rb8,rd16,1`/`ldbu rd31,rb8,0` ——实际读到的是 `&accG` 的低字节
  # （accG 当前值），不是 `snap` 的溢出槽。
  #
  # **为什么寄存器分配器会犯这个错**：`DADAORegisterInfo::getCalleeSavedRegs`
  # 只列 RD8-RD15（无任何 RB 寄存器），`getReservedRegs` 只保留 rb0-rb7；
  # `getCallPreservedMask`（由这两者算出 caller-saved 集合的标准接口）本身
  # 实现是对的——rb8 及以上正确地不在 preserved mask 里。但
  # `DADAOISelLowering::LowerCall` 从未调用 `getCallPreservedMask` 或把结果
  # 附加成 CALL 节点的 RegMask 操作数（`grep RegMask/getCallPreservedMask/
  # getRegisterMask DADAOISelLowering.cpp` 零命中）；`DADAOInstrInfo.td` 里
  # `let isCall=1, Defs=[RD31] in def CALL_IIII` 声明的 `Defs=[RD31]` 只对
  # `CALL_IIII`（直接/PC相对调用）生效——TableGen 的 `let X in` 单语句作
  # 用域规则下，紧跟着定义的 `CALL_RRII` 其实不在这个 `let` 范围内、完全没
  # 有 `Defs`/`isCall` 标记（**架构师复核更正**：ML-004b 原文误写成
  # "CALL_IIII/CALL_RRII 都声明 Defs=[RD31]"，已用
  # `llvm-tblgen -gen-instr-info` 生成的 `DADAOGenInstrInfo.inc` 核实——
  # `CALL_RRII` 0 implicit-defs、无 `MCID::Call` 标记）。但这个不精确不影响
  # 结论：`CALL_RRII` 本身从不在寄存器分配阶段出现（只在 RA 之后
  # `expandPostRAPseudo` 里用 `BuildMI` 手工合成，此时已经没有寄存器分配
  # 决策要做）；RA 阶段实际看到的间接调用伪指令是 `CALL_PSEUDO_INDIRECT`
  # （`DADAOInstrInfo.td` ~行142-147），它单独、正确地声明了
  # `Defs=[RD31]`，和 `CALL_IIII` 一样缺 RegMask/GPRB clobber 信息，同样
  # 触发本 issue。即 RA 阶段唯二会见到的 CALL 类指令（`CALL_IIII` 直接调
  # 用、`CALL_PSEUDO_INDIRECT` 间接调用）都只声明 `Defs=[RD31]`，都没有
  # RegMask（DL-065a 时为了修 implicit-use 溢出问题去掉了静态 `Uses` 列
  # 表，但从未补上 GPRB 的 `Defs`/RegMask）。结果：寄存器分配器判断一条
  # CALL 指令"覆盖"了什么完全按这条静态 `Defs=[RD31]` 走，从不知道 rb8+
  # 会被调用方clobber，于是放心地让 GPRB 值"存活"跨调用而不做溢出/重算。
  #
  # **影响范围**：任何"计算一个 GPRB 地址值→发生调用→调用后再用这个地址
  # 值"的模式都会中招——这是相当常见的形态（数组/全局变量访问 + 函数调用
  # 混合的真实 C 程序），本次是被 llvm-test-suite 的 4 个纯计算测试头一次
  # 暴露（更早的手写 .ll/简单 C 测试都没有这个"调用前后都要用同一个 GPRB
  # 地址值"的形状）。4 个故障（3 MALIGN + 1 数值错）**并非各自独立的
  # bug，而是同一根因的 4 种不同表现**（MALIGN vs 纯数值错，取决于陈旧
  # 地址恰好落在什么对齐边界/什么内存区域）。
  #
  # **不在本任务修**（ML-004b 明确要求宽的问题只报告、不强行修）：合理的
  # 修复方向是在 `DADAOISelLowering::LowerCall` 里给 CALL 的 SDNode/
  # MachineInstr 附加 `DAG.getRegisterMask(TRI->getCallPreservedMask(MF, CC))`
  # 操作数（标准 LLVM 模式，`getCallPreservedMask` 本身已经实现对——只是
  # 没接上），但改动后需要对全部差分向量+E2E+多个真实调用密集的程序做
  # 完整回归，不是本任务范围内能验证到位的窄修复。
  #
  # 被这个根因阻塞、未固化为 lit fixture 的用例：crc8.le/crc16.be/
  # popcount-clz-ctz（MALIGN 0x81）、divtest（数值错但双后端一致）。
  #
  # **ML-004c（2026-07-16）已修**：`DADAOISelLowering::LowerCall` 附加
  # `DAG.getRegisterMask(TRI->getCallPreservedMask(MF, CallConv))` 到
  # `DADAOISD::CALL` SDNode（标准 LLVM 模式，参照 RISCVISelLowering）；
  # `DADAOISelDAGToDAG.cpp` `Select()` 里 DL-065a 已有的操作数转发循环
  # 不加修改就把这个新操作数原样带进 `CALL_IIII`/`CALL_PSEUDO_INDIRECT`
  # 的 MachineInstr（`InstrEmitter::AddOperand` 本身认识
  # `RegisterMaskSDNode`）。**修复过程中发现并连带修了第二个、此前从未
  # 触发过的潜伏 bug**：`DADAOInstrInfo::storeRegToStackSlot`/
  # `loadRegFromStackSlot` 对 GPRD 和 GPRB 两个寄存器类都统一走
  # `STO_FI`/`LDO_FI`，但这两个伪指令背后是 RD-bank 的
  # `STO_RRII`/`LDO_RRII` 编码（RD load/store），不是 spec §4.1 "RB
  # Single Load/Store" 描述的 RB-bank `STO_RBRRII`/`LDO_RBRRII`
  # 编码（`DADAOInstrInfo.td` 里其实早已存在，只是从未接到溢出路径
  # 上）——用 RD-bank 编码溢出一个 GPRB 寄存器，会把该寄存器的编号原样
  # 套进 RD 寄存器编号位置，静默溢出/重载了错误的物理寄存器。这个 bug
  # 此前从未暴露，因为在本 issue 修复之前寄存器分配器从不知道要在调用前后
  # 溢出/重载 GPRB 值——RegMask 一接上、分配器第一次真正尝试溢出 GPRB
  # 寄存器就踩了它。新增 `LDO_RB_FI`/`STO_RB_FI` 伪指令（`eliminateFrameIndex`
  # 解析到 `LDO_RBRRII`/`STO_RBRRII`），GPRB 类走这条路径。
  #
  # **验证**：issue 最小复现（host=36）双后端由 QEMU=21(错)/gem5=134(SIGABRT)
  # → QEMU=gem5=36；反汇编确认改用 RB-bank opcode 0x43/0x4B（此前
  # 0x33/0x3B）。判别性探针（`snapshot_bug2.c` 调用前后读同一 GPRB 值、
  # 嵌套调用、指针类型调用参数）双后端全部与 host 吻合。此前受阻的全部
  # 8 个 llvm-test-suite 用例（crc8.le/crc16.be/popcount-clz-ctz/divtest/
  # long_shifts/loopbug/loopbug2/int_overflow）双后端全部转为通过，已固化
  # 为新 lit fixture（`tests/lit/E2E/llvm-test-suite/{crc8_le,crc16_be,
  # popcount_clz_ctz,divtest,long_shifts,loopbug,loopbug2,int_overflow}.test`）。
  # 全 E2E 50/51（同一已知无关的 `syscall_hello.test` 失败）、四方
  # AGREE(3-way)=200/DIVERGE=0、Sail AGREE(4-way)=200，不回归。

- id: codegen-switch-dispatch-malign-in-callee
  title: "ML-004b 扩充测试 switch_stmt：故障（MALIGN 0x81，双后端一致）发生在 switch-dispatch 的被调用函数内部，疑似独立于 codegen-call-clobbers-gprb-not-declared 的跳转表相关缺陷"
  status: closed
  scope: [CodeGen]
  blocks: null
  resolved_by: ML-004d
  # ML-004b（2026-07-16，subagent）扩充覆盖时发现，未展开根因排查（任务
  # 范围内标注为"likely a distinct, uninvestigated jump-table issue"）。
  # 与 codegen-call-clobbers-gprb-not-declared 的区别：那批故障都在
  # "调用返回之后"，这次故障在被调用函数内部本身。留待后续任务定位。
  #
  # ML-004d（2026-07-16）根因：**三个**独立缺陷叠加，jump table 是仓库里
  # 第一个"同 .text section 内引用同 section 符号"的构造（此前 rela/
  # addi_rb 全部用于访问 .data 段全局变量，跨 section，从未走到下列同
  # section 短路分支）：
  # (1) DADAOAsmBackend::applyFixup 的 FK_Data_8（`.quad LBBn` 跳转表条目）
  #     分支：符号"已定义 + 同 section"时无条件直接写 Value（未经检查
  #     IsResolved），但对非 PC-relative fixup，MCAssembler::evaluateFixup
  #     算出的 IsResolved=Target.isAbsolute()——只要涉及符号就是 false，
  #     Value 只是符号在本 section 内的预链接偏移（不是最终绝对地址）。
  #     结果：跳转表 `.quad` 条目被写成 (目标块偏移-函数偏移) 而非真绝对
  #     地址（真实复现：本该是 0x80000054 却写成 0x4c）。修复：只有真正
  #     IsResolved（无符号纯常量）才直接写，否则一律走 maybeAddReloc，让
  #     链接器用 R_DADAO_ABS64 计算真实地址（和跨 section 全局变量场景
  #     一致的路径，早已验证正确）。
  # (2) fixup_dadao_rela_page/rela_lo 的"同 section 快速路径"（ML-003j
  #     引入，patch 0030，动机是排查另一个 vfprintf.c 问题、最终未采用其
  #     诊断路径而是 ML-003k 修的 dead-block 问题——这条快速路径本身从未
  #     被真正验证过端到端正确性）：用于计算跳转表**自身基址**（`rela
  #     rb8,.LJTI0_0`/`addi rb8,rb8,.LJTI0_0`，测试函数引用嵌在自己内部
  #     的跳转表数据）。该公式对 PC-relative 页对齐（&~0xFFF 掩码）和低
  #     12 位在跨多个目标文件链接（如 crt0.o 贡献的若干字节）时不是
  #     line-invariant 的（不同于 call24/branch18/branch12 的纯差值计算，
  #     掩码操作对外部固定位移不封闭）；且原公式本身代数有误（"+4"错误
  #     叠加）。真实复现：imm18 算成 -1（应为 0）。修复：同样一律走
  #     maybeAddReloc，交给已验证正确的链接器 R_DADAO_RELA_PAGE/RELA_LO
  #     handler（lld/ELF/Arch/DADAO.cpp）用真实最终地址计算。
  # (3) BRIND（switch 跳转表分派本身的间接跳转）复用了与
  #     codegen-indirect-call-rb0-misuse（DL-066a）同一家族的 rb0 误用：
  #     `jump rbha,rdhb,imm12` 对 rbha=rb0 特殊定义为"相对跳转"（非"零基
  #     址"），旧 Pat 直接 `(JUMP_RRII RB0, GPRD:$target, 0)` 把跳转表读出
  #     的绝对地址当成相对偏移叠加到 PC+4 上。修复：仿 DL-066a 引入
  #     JUMP_PSEUDO_INDIRECT 伪指令，expandPostRAPseudo 里用 rd2rb 桥先把
  #     绝对地址物化进 scratch RB5，再 `jump rb5, rd0, 0`（base=绝对地址，
